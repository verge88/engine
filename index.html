<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Engine — WebGPU 3D</title>
  <link rel="stylesheet" href="./src/style.css">
</head>
<body>
  <canvas id="viewport" aria-label="3D viewport"></canvas>
  <header class="toolbar">
    <div class="brand"><span class="logo">◈</span><div><strong>ENGINE</strong><small>WebGPU · Render Lab 0.1</small></div></div>
    <div class="tools">
      <button id="demo" type="button">Демо-сцена</button>
      <label class="file-button">Открыть модель .glb<input id="model" type="file" accept=".glb,model/gltf-binary"></label>
      <label class="exposure">Экспозиция <input id="exposure" type="range" min="0.25" max="2.5" step="0.05" value="1"><output id="exposure-value">1.00</output></label>
    </div>
  </header>
  <aside class="hint">
    <strong>Управление камерой</strong>
    <p>ЛКМ — вращение · Колесо — масштаб · WASD — перемещение · Space / Shift — высота</p>
    <p>Можно перетащить GLB-файл в окно.</p>
  </aside>
  <div class="footer"><span id="status" role="status">Инициализация WebGPU…</span><span id="fps">— FPS</span></div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
